#textdomain wesnoth-AD
[scenario]
    id=02_Welcome_to_Wesnoth
    next_scenario=03_The_Iron_Hunt
    name= _ "Welcome to Wesnoth"
    {AD_MAP 02_Welcome_to_Wesnoth.map}

    victory_when_enemies_defeated=yes
    experience_modifier=100
    carryover_percentage=40
    carryover_add=yes
    bonus=yes

    random_start_time=no

    {DEFAULT_SCHEDULE}

    {TURNS 22 18 16}

    {SCENARIO_MUSIC "siege_of_laurelmor.ogg"}
    {EXTRA_SCENARIO_MUSIC "vengeful.ogg"}
    {EXTRA_SCENARIO_MUSIC "the_city_falls.ogg"}

    [story]
        [part]
            story= _ "Wesnoth’s messenger brought Bazur’s band before the walls of Soradoc, administrative seat of the Horse Clans and the only clan in open revolt against the crown. Queen Asheviere was personally leading the siege."
            {AD_BIGMAP}
            {JOURNEY_01_OLD}
        [/part]
    [/story]

    [side]
        side=1
        controller=human
        save_id=bazur
        fog=no
        shroud=no
        share_vision=all
        {BAZUR_ARC_I}
        gold=130
        {INCOME 5 3 1}
        recruit=Orcish Grunt,Orcish Archer,Orcish Assassin,Wolf Rider,Troll Whelp,Goblin Spearman
        team_name=bazur
        user_team_name= _ "Bazur"
        {FLAG_VARIANT ragged}
    [/side]

    {SILENTLY_LIMIT_LEADER_MOVES 2 1}
   
    [side]
        side=2
        controller=ai
        fog=no
        shroud=no
        share_vision=all
        type=Grand Knight
        id=Sir_Roland
        name= _ "Sir Roland"
        [modifications]
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
        extra_recruit=Horseman,Knight
        gold=170
        team_name=bazur
        user_team_name= _"Asheviere’s Forces"
        {FLAG_VARIANT loyalist}

        [ai]
            passive_leader=yes 
        [/ai]

        [unit]
            type=Javelineer
            x,y=9,35
            ai_special=guardian
            facing=ne
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_STRONG}
            [/modifications]
        [/unit]

        [unit]
           {DOMMEL}
           x,y=10,39 
           extra_recruit=Swordsman,Longbowman,Pikeman,Shock Trooper
        [/unit]

        [unit]
            type=Javelineer
            x,y=10,35
            ai_special=guardian
            facing=ne
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_STRONG}
            [/modifications]
        [/unit]

        [unit]
            type=Javelineer
            x,y=12,36
            ai_special=guardian
            facing=ne
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_STRONG}
            [/modifications]
        [/unit]

        [unit]
            type=Javelineer
            x,y=13,37
            ai_special=guardian
            facing=ne
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_STRONG}
            [/modifications]
        [/unit]

        [unit]
            type=Royal Guard
            name= _ "Queen’s Bodyguard" 
            x,y=8,40
            ai_special=guardian
            facing=ne
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_STRONG}
            [/modifications]
        [/unit]

        [unit]
            type=Royal Guard
            name= _ "Queen’s Bodyguard" 
            x,y=7,40
            facing=ne
            ai_special=guardian
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_STRONG}
            [/modifications]
        [/unit]

        [unit]
            {ASHEVIERE}
            [modifications]
                {TRAIT_INTELLIGENT}
                {TRAIT_QUICK}
                {MOVE_TO_CASTLE_ONLY}
            [/modifications]
            x,y=7,41
            facing=n
            ai_special=guardian
        [/unit]
    [/side]

    {SILENTLY_LIMIT_LEADER_MOVES 3 1}

    [side]
        side=3
        controller=ai
        fog=no
        shroud=no
        share_vision=all
        type=Paladin
        id=Sir_Elec
        name= _ "Sir Elec"
        [modifications]
            {TRAIT_INTELLIGENT}
            {TRAIT_STRONG}
        [/modifications]
        {GOLD 240 320 400}
        {INCOME 8 10 12}
        recruit=Spearman,Bowman,Horseman,Knight,Lancer
        team_name=rebels
        user_team_name= _"Rebel Forces"
        {FLAG_VARIANT long}

        [ai]
            passive_leader=yes 

            [goal]
                name=target_unit 
                [criteria]
                    side=1 
                [/criteria]
                value=4 
            [/goal]
            [goal]
                name=target_unit 
                [criteria]
                    side=2
                [/criteria]
                value=2
            [/goal]
        [/ai]
    [/side]

    [event]
    name=prestart 

        [hide_unit]
            id=Bazur 
        [/hide_unit]
    [/event]

    [event]
    name=start 

        [sound]
            name=ambient/ship.ogg 
        [/sound]

        [move_unit_fake]
            side=1
            type=Boat 
            x=9,8
            y=1,4
        [/move_unit_fake]

        {PLACE_IMAGE "units/transport/boat.png~FL(horiz)" 8 4}

        [move_unit_fake]
            side=1
            type=Boat 
            x=9,9
            y=1,5
        [/move_unit_fake]

        {PLACE_IMAGE "units/transport/boat.png~FL(horiz)" 9 5}

        [move_unit_fake]
            side=1
            type=Boat 
            x=9,9
            y=1,6
        [/move_unit_fake]

        {PLACE_IMAGE "units/transport/boat.png~FL(horiz)" 9 6}

        [unhide_unit]
            id=Bazur 
        [/unhide_unit]

        {MOVE_UNIT id=Bazur 7 6}

        [unit]
            side=1 
            type=Dragoon
            id=Messenger 
            x,y=9,6
            [modifications]
                {TRAIT_LOYAL_HERO}
                {TRAIT_QUICK}
            [/modifications]
        [/unit]

        {MOVE_UNIT id=Messenger 7 6}

        [terrain]
            x,y,radius=7,6,1
            terrain=Co 
        [/terrain]

        [terrain]
            x,y,radius=7,6
            terrain=Ko 
        [/terrain]

        [redraw][/redraw]

        {MOVE_UNIT id=Messenger 1 1}

        [kill]
            id=Messenger
            animate=no 
        [/kill]
    [/event]

    {AD_MARAUDERS}
    {AD_CAPTURE_EVENT 3}
    {STARTING_VILLAGES_ALL 3}
    {STARTING_VILLAGES 2 5}
    {STARTING_VILLAGES_AREA 0 21 4 10}
[/scenario]
